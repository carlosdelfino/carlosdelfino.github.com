<div id="cookie-notice" role="dialog" aria-live="polite" aria-label="Aviso de cookies" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#222;color:#eee;padding:12px 16px;font-size:14px;line-height:1.5;box-shadow:0 -2px 8px rgba(0,0,0,.4)">
  <div class="container" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:center">
    <span>Este site usa cookies para estatísticas (Google Analytics) e publicidade (Google AdSense e parceiros). Ao continuar navegando, você concorda com o uso de cookies conforme a nossa <a href="{{ site.baseurl }}/privacidade/" style="color:#8ec7ff;text-decoration:underline">Política de Privacidade</a>.</span>
    <button id="cookie-notice-accept" type="button" style="background:#448dd6;border:0;color:#fff;padding:6px 16px;cursor:pointer;border-radius:3px;white-space:nowrap">Aceitar</button>
  </div>
</div>
<script>
(function () {
  var KEY = "cookie-consent";
  try {
    if (localStorage.getItem(KEY)) return;
    var el = document.getElementById("cookie-notice");
    if (!el) return;
    el.style.display = "block";
    document.getElementById("cookie-notice-accept").addEventListener("click", function () {
      localStorage.setItem(KEY, "accepted");
      el.style.display = "none";
    });
  } catch (e) { /* localStorage indisponível: não exibe o aviso */ }
})();
</script>
